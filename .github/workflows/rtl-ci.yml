name: RTL CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  rtl-verify:
    name: RTL Verification (Icarus Verilog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Verify Icarus Verilog installation
        run: iverilog -V

      - name: Compile standalone RTL modules (syntax check)
        run: |
          for f in rtl/*.sv; do
            # Skip modules that need dependencies (tested separately)
            case "$f" in
              *security_integration*) echo "=== Skipping $f (tested separately) ==="; continue ;;
            esac
            echo "=== Compiling $f ==="
            iverilog -g2012 -o /tmp/rtl_test.vvp "$f"
          done
          echo "All standalone RTL modules compiled successfully"

      - name: Run demo testbench (simple Loader FSM)
        run: |
          mkdir -p build
          iverilog -g2012 -o build/demo_tb.vvp \
            fpga/tb/demo_tb.sv \
            fpga/tb/demo_loader_fsm.sv
          vvp build/demo_tb.vvp

      - name: Run full Loader FSM testbench
        run: |
          iverilog -g2012 -o build/tb_loader_fsm.vvp \
            rtl/loader_fsm_asic.sv \
            fpga/tb/tb_loader_fsm.sv
          vvp build/tb_loader_fsm.vvp
          echo "Full Loader FSM testbench PASSED"

      - name: Run error handling testbench (bad signature)
        run: |
          iverilog -g2012 -o build/tb_loader_fsm_error.vvp \
            rtl/loader_fsm_asic.sv \
            fpga/tb/tb_loader_fsm_error.sv
          vvp build/tb_loader_fsm_error.vvp
          echo "Error handling testbench PASSED"

      - name: Run Apollo-2 kill switch testbench
        run: |
          iverilog -g2012 -o build/tb_apollo.vvp \
            rtl/apollo_kill_switch.sv \
            fpga/tb/tb_apollo_kill_switch.sv
          vvp build/tb_apollo.vvp
          echo "Apollo-2 kill switch testbench PASSED"

      - name: Run cycle monitor testbench
        run: |
          iverilog -g2012 -o build/tb_cm.vvp \
            rtl/cycle_monitor.sv \
            fpga/tb/tb_cycle_monitor.sv
          vvp build/tb_cm.vvp
          echo "Cycle monitor testbench PASSED"

      - name: Run security integration testbench
        run: |
          iverilog -g2012 -o build/tb_si.vvp \
            rtl/security_integration.sv \
            rtl/cycle_monitor.sv \
            rtl/apollo_kill_switch.sv \
            fpga/tb/tb_security_integration.sv
          vvp build/tb_si.vvp
          echo "Security integration testbench PASSED"

      - name: Run shield health monitor testbench
        run: |
          iverilog -g2012 -o build/tb_sh.vvp \
            rtl/shield_health_monitor.sv \
            fpga/tb/tb_shield_health_monitor.sv
          vvp build/tb_sh.vvp
          echo "Shield health monitor testbench PASSED"

      - name: Run PUF health monitor testbench
        run: |
          iverilog -g2012 -o build/tb_phm.vvp \
            rtl/puf_health_monitor.sv \
            fpga/tb/tb_puf_health_monitor.sv
          vvp build/tb_phm.vvp
          echo "PUF health monitor testbench PASSED"

